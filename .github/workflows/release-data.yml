name: Release language data

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-data:
    runs-on: ubuntu-latest
    env:
      MISAKI_SOURCE_COMMIT: beb91a9f06ebe5e25e595b5a3c990ee616ad75e5
    steps:
      - name: Download MisakiSharp data
        run: |
          mkdir -p "$RUNNER_TEMP/misaki-source"
          curl -fsSL "https://github.com/Lyrcaxis/MisakiSharp/archive/${MISAKI_SOURCE_COMMIT}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/misaki-source"

      - name: Create release and upload language data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MisakiSharp WASM ${GITHUB_REF_NAME#v}" \
              --notes "Browser runtime and lazy-loaded language data for MisakiSharp WASM ${GITHUB_REF_NAME#v}."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/misaki-source/data/"*.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish CORS-enabled browser mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/misaki-source/data"
          git init -b "data-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.gz
          git commit -m "Publish browser data mirror for $GITHUB_REF_NAME"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/data-${GITHUB_REF_NAME}"
